[package]
name = "tessera"
version = "0.1.0"
edition = "2021"
description = "A minimal, keyboard-driven tiling window manager for Windows, inspired by Hyprland."
license = "MIT"
readme = "README.md"
keywords = ["window-manager", "tiling", "windows", "win32", "hyprland"]
categories = ["gui"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
